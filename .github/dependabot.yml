version: 2
updates:
  # Bun dependencies
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "bun"

    commit-message:
      prefix: "deps"
      include: "scope"

    pull-request-branch-name:
      separator: "/"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Sao_Paulo"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "ci"
      include: "scope"

    pull-request-branch-name:
      separator: "/"

    groups:
      actions:
        patterns:
          - "*"

name: Orchestrator
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write

  publish:
    needs: release
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
